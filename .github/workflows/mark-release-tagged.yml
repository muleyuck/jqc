name: Mark Release Tagged

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions: {}

jobs:
  mark-tagged:
    # Release also runs on pull_request, so without the event check this fires
    # on every pull request, including ones opened from a fork.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark merged release PR as tagged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --label "autorelease: pending" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          fi
