name: Release Please

on:
  workflow_run:
    workflows:
      - unit-test
    types:
      - completed
    branches:
      - main

permissions: {}

jobs:
  release-please:
    # The branches filter matches the branch of the triggering run, so a fork
    # whose head branch is called main would otherwise reach this job.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: write
      pull-requests: write
    uses: muleyuck/github-actions/.github/workflows/release-please.yml@v1

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # This workflow runs from main (workflow_run); the files come from the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jqc-*
          path: dist
          merge-multiple: true

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      # Only after the archives are attached, so the formula never points at a missing file.
      - name: Publish the formula
        uses: muleyuck/github-actions/actions/homebrew/publish@v1
        with:
          template: packaging/jqc.rb.in
          tap-path: Formula/jqc.rb
          version: ${{ env.VERSION }}
          sha256: |
            SHA256_AARCH64_APPLE_DARWIN=dist/jqc-aarch64-apple-darwin.tar.xz
            SHA256_X86_64_APPLE_DARWIN=dist/jqc-x86_64-apple-darwin.tar.xz
            SHA256_AARCH64_UNKNOWN_LINUX_GNU=dist/jqc-aarch64-unknown-linux-gnu.tar.xz
            SHA256_X86_64_UNKNOWN_LINUX_GNU=dist/jqc-x86_64-unknown-linux-gnu.tar.xz
          client-id: ${{ secrets.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
