name: Release Please

on:
  workflow_run:
    workflows:
      - unit-test
    types:
      - completed
    branches:
      - main

permissions: {}

jobs:
  release-please:
    # The branches filter matches the branch of the triggering run, so a fork
    # whose head branch is called main would otherwise reach this job.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: write
      pull-requests: write
    uses: muleyuck/github-actions/.github/workflows/release-please.yml@v1

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/build-release.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # This workflow runs from main (workflow_run); the files come from the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jqc-*
          path: dist
          merge-multiple: true

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      # Only after the archives are attached, so the formula never points at a missing file.
      - name: Render the formula
        run: |
          sha() { cut -d ' ' -f 1 "dist/jqc-$1.tar.xz.sha256"; }
          mkdir -p "$RUNNER_TEMP/Formula"
          sed -e "s/@VERSION@/${VERSION}/" \
            -e "s/@SHA256_AARCH64_APPLE_DARWIN@/$(sha aarch64-apple-darwin)/" \
            -e "s/@SHA256_X86_64_APPLE_DARWIN@/$(sha x86_64-apple-darwin)/" \
            -e "s/@SHA256_AARCH64_UNKNOWN_LINUX_GNU@/$(sha aarch64-unknown-linux-gnu)/" \
            -e "s/@SHA256_X86_64_UNKNOWN_LINUX_GNU@/$(sha x86_64-unknown-linux-gnu)/" \
            packaging/jqc.rb.in > "$RUNNER_TEMP/Formula/jqc.rb"
          if grep -n '@[A-Z0-9_]*@\|sha256 ""' "$RUNNER_TEMP/Formula/jqc.rb"; then
            echo "unreplaced value above" >&2
            exit 1
          fi
          brew style "$RUNNER_TEMP/Formula/jqc.rb"

      - name: Get a token for the tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: muleyuck
          repositories: homebrew-tap
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: muleyuck/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Publish the formula
        working-directory: tap
        run: |
          cp "$RUNNER_TEMP/Formula/jqc.rb" Formula/jqc.rb
          git add Formula/jqc.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "jqc ${VERSION}"
          git push
