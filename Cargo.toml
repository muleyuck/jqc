[package]
name = "jqc"
version = "1.0.0"
edition = "2024"
description = "jq for JSONC — query, view, and edit JSON-with-Comments files without losing your comments."
license = "MIT"
repository = "https://github.com/muleyuck/jqc"
homepage = "https://github.com/muleyuck/jqc"

[[bin]]
name = "jqc"
path = "src/main.rs"

[dependencies]
jsonc-parser = { version = "0.34.0", features = ["cst", "serde_json", "serde", "preserve_order"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
anyhow = "1.0.102"
tempfile = "3.27.0"
is-terminal = "0.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
